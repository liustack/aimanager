# Packaging for release artifacts. Everything ships pre-bundled from
# electron-vite's out/, so no node_modules go into the app.
appId: com.liustack.aimanager
productName: AIManager
directories:
  buildResources: build
  output: dist
files:
  - out/**
# All runtime code is bundled by vite; keep node_modules out of the package.
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  # No Developer ID yet. "-" runs the full signing pipeline with an ad-hoc
  # identity (sealed resources included). Without it Gatekeeper reports the
  # downloaded app as "damaged" with no bypass; with it the dialog becomes
  # "cannot verify", which System Settings can override. Hardened runtime is
  # contradictory on an ad-hoc signature, so keep it off.
  identity: "-"
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  releaseType: release
