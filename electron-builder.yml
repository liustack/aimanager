# Packaging for release artifacts. Everything ships pre-bundled from
# electron-vite's out/, so no node_modules go into the app.
appId: com.liustack.aimanager
productName: AIManager
directories:
  buildResources: build
  output: dist
files:
  - out/**
# All runtime code is bundled by vite; keep node_modules out of the package.
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  # Developer ID signing + notarization. The identity is auto-discovered from
  # the keychain (CI imports the cert via CSC_LINK/CSC_KEY_PASSWORD);
  # notarization credentials come from APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID. Local `pnpm dist` without these still packages, just
  # unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  releaseType: release
