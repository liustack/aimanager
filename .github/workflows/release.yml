name: release

# Builds installable artifacts and attaches them to the GitHub Release when a
# v* tag is pushed: macOS DMGs (arm64 + x64, Developer ID signed + notarized)
# and a Windows NSIS installer (unsigned; SmartScreen shows a first-run
# prompt). macOS signing needs five repo secrets: MAC_CERT_P12 (base64 .p12),
# MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The two platform builds finish at different times but start together; if
  # the release does not exist yet, each electron-builder creates one and the
  # tag ends up with two releases (happened on v0.1.2). Create it up front so
  # both builds only attach assets.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 预创建 Release
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "AIManager $GITHUB_REF_NAME" --notes "见 CHANGELOG.md / See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门
        run: pnpm typecheck && pnpm test

      - name: 构建并发布产物
        run: pnpm dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization; empty on the Windows runner, where
          # electron-builder ignores them.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
