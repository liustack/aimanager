name: release

# Builds installable artifacts and attaches them to the GitHub Release when a
# v* tag is pushed: macOS DMGs (arm64 + x64) and a Windows NSIS installer.
# Builds are unsigned for now (no certificates); macOS relies on ad-hoc
# signing, Windows will show SmartScreen's first-run prompt.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门
        run: pnpm typecheck && pnpm test

      - name: 构建并发布产物
        run: pnpm dist --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
